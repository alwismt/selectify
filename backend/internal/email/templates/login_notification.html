<p>Hi {{.FirstName}} {{.LastName}},</p>
<p>We noticed a new login to your Selectify account.</p>
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:16px 0;font-size:14px;line-height:1.6;">
  <tr>
    <td style="padding:4px 12px 4px 0;color:#666;vertical-align:top;">Time</td>
    <td style="padding:4px 0;">{{.LoggedInAt}}</td>
  </tr>
  <tr>
    <td style="padding:4px 12px 4px 0;color:#666;vertical-align:top;">IP</td>
    <td style="padding:4px 0;">{{.IP}}</td>
  </tr>
  <tr>
    <td style="padding:4px 12px 4px 0;color:#666;vertical-align:top;">Location</td>
    <td style="padding:4px 0;">{{.Location}}</td>
  </tr>
  <tr>
    <td style="padding:4px 12px 4px 0;color:#666;vertical-align:top;">Device</td>
    <td style="padding:4px 0;">{{.UserAgent}}</td>
  </tr>
</table>
<p>If this was you, no action is needed. If you did not sign in, please secure your account immediately.</p>
